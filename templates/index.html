<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BMI 계산기</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            max-width: 420px;
            margin: 60px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 { font-size: 22px; }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        label { font-size: 14px; font-weight: 600; }
        input {
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 10px;
            font-size: 15px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .result {
            padding: 16px;
            background: #f1f5f9;
            border-radius: 8px;
        }
        .result .bmi-value {
            font-size: 28px;
            font-weight: 700;
            color: #2563eb;
        }
        .error {
            color: #dc2626;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>BMI 계산기</h1>
    <form method="post">
        <div>
            <label for="height">키 (cm)</label>
            <input type="number" step="0.1" id="height" name="height" required
                   value="{{ result.height if result }}">
        </div>
        <div>
            <label for="weight">몸무게 (kg)</label>
            <input type="number" step="0.1" id="weight" name="weight" required
                   value="{{ result.weight if result }}">
        </div>
        <button type="submit">계산하기</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if result %}
        <div class="result">
            <div>BMI 지수</div>
            <div class="bmi-value">{{ result.bmi }}</div>
            <div>판정: {{ result.category }}</div>
        </div>
    {% endif %}
</body>
</html>
